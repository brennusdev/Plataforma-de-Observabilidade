groups:

  - name: observability-alerts

    rules:

      - alert: HighCPUUsage

        expr:
          system_cpu_usage_percent >= 90

        for: 2m

        labels:
          severity: critical

        annotations:

          summary: "High CPU usage"

          description:
            "CPU usage has remained above 90% for 2 minutes."


      - alert: HighMemoryUsage

        expr:
          system_memory_usage_percent >= 85

        for: 2m

        labels:
          severity: warning

        annotations:

          summary: "High memory usage"

          description:
            "Memory usage has remained above 85% for 2 minutes."


      - alert: HighDiskUsage

        expr:
          system_disk_usage_percent >= 90

        for: 5m

        labels:
          severity: critical

        annotations:

          summary: "High disk usage"

          description:
            "Disk usage has remained above 90% for 5 minutes."


      - alert: ApplicationDown

        expr:
          application_up == 0

        for: 1m

        labels:
          severity: critical

        annotations:

          summary: "Application unavailable"

          description:
            "The observability API is unavailable."