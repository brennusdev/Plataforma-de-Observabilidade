groups:

  - name: infrastructure

    rules:

      - alert: HighCPUUsage

        expr: system_cpu_usage_percent >= 90

        for: 2m

        labels:

          severity: critical

        annotations:

          summary: "High CPU usage"


      - alert: HighMemoryUsage

        expr: system_memory_usage_percent >= 85

        for: 2m

        labels:

          severity: warning

        annotations:

          summary: "High memory usage"


      - alert: HighDiskUsage

        expr: system_disk_usage_percent >= 90

        for: 5m

        labels:

          severity: critical

        annotations:

          summary: "High disk usage"


  - name: application

    rules:

      - alert: HighErrorRate

        expr: |
          (
            sum(rate(http_request_errors_total[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.05

        for: 5m

        labels:

          severity: critical

        annotations:

          summary: "HTTP error rate above 5%"


      - alert: HighP95Latency

        expr: |
          histogram_quantile(
            0.95,
            sum(
              rate(
                http_request_duration_seconds_bucket[5m]
              )
            ) by (le)
          ) > 1

        for: 5m

        labels:

          severity: warning

        annotations:

          summary: "P95 latency above 1 second"


      - alert: TooManyActiveRequests

        expr: http_active_requests > 100

        for: 2m

        labels:

          severity: warning

        annotations:

          summary: "High number of active requests"