services:
  api:
    build: .
    container_name: observability_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://observability:observability@db:5432/observability
      APP_NAME: Observability Platform
      COLLECT_INTERVAL_SECONDS: 15
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: observability_db
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: observability
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observability -d observability"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
