services:

  api:

    build: .

    container_name: observability-api

    ports:

      - "8000:8000"

    environment:

      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/observability

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

      OTEL_SERVICE_NAME: observability-api

    depends_on:

      - db
      - prometheus
      - otel-collector


  db:

    image: postgres:16

    container_name: observability-db

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: observability

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data


  prometheus:

    image: prom/prometheus:latest

    container_name: observability-prometheus

    ports:

      - "9090:9090"

    volumes:

      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml

    command:

      - "--config.file=/etc/prometheus/prometheus.yml"


  grafana:

    image: grafana/grafana:latest

    container_name: observability-grafana

    ports:

      - "3000:3000"

    depends_on:

      - prometheus
      - jaeger

    volumes:

      - grafana_data:/var/lib/grafana

      - ./grafana/provisioning:/etc/grafana/provisioning

      - ./grafana/dashboards:/var/lib/grafana/dashboards


  otel-collector:

    image: otel/opentelemetry-collector-contrib:latest

    container_name: observability-otel

    command:

      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:

      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml

    ports:

      - "4317:4317"

      - "4318:4318"

    depends_on:

      - jaeger


  jaeger:

    image: jaegertracing/all-in-one:latest

    container_name: observability-jaeger

    ports:

      - "16686:16686"

      - "4317:4317"

      - "4318:4318"

    environment:

      COLLECTOR_OTLP_ENABLED: "true"


volumes:

  postgres_data:

  grafana_data: